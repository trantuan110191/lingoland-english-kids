  <circle cx='240' cy='310' r='8' fill='white' opacity='0.5'/>
  <circle cx='268' cy='285' r='6' fill='white' opacity='0.4'/>
  <circle cx='250' cy='350' r='5' fill='white' opacity='0.45'/>
  <circle cx='285' cy='330' r='7' fill='white' opacity='0.4'/>
  <circle cx='230' cy='380' r='6' fill='white' opacity='0.35'/>
  <!-- Kawaii face -->
  <circle cx='235' cy='360' r='11' fill='#FFF59D'/>
  <circle cx='277' cy='360' r='11' fill='#FFF59D'/>
  <circle cx='238' cy='357' r='4' fill='#333'/>
  <circle cx='280' cy='357' r='4' fill='#333'/>
  <circle cx='239' cy='355' r='1.5' fill='white'/>
  <circle cx='281' cy='355' r='1.5' fill='white'/>
  <!-- Cheeks -->
  <circle cx='220' cy='375' r='11' fill='#FFCCBC' opacity='0.7'/>
  <circle cx='292' cy='375' r='11' fill='#FFCCBC' opacity='0.7'/>
  <!-- Smile -->
  <path d='M243 380 Q256 393 269 380' stroke='#FFF59D' stroke-width='3.5' fill='none' stroke-linecap='round'/>
  <!-- Sparkles -->
