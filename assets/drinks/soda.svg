  <rect x='246' y='140' width='20' height='12' rx='4' fill='#B0BEC5' stroke='#78909C' stroke-width='2'/>
  <!-- White wave design (Coca-Cola style) -->
  <path d='M185 240 Q220 220 256 240 Q292 260 327 240 L327 280 Q292 300 256 280 Q220 260 185 280 Z' fill='white' opacity='0.9'/>
  <!-- Shine effect -->
  <rect x='200' y='180' width='16' height='220' rx='8' fill='white' opacity='0.35'/>
