<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'>
  <rect width='512' height='512' fill='white'/>
  <!-- Shadow -->
  <ellipse cx='256' cy='468' rx='110' ry='16' fill='rgba(0,0,0,0.10)'/>
  <!-- Cup body -->
  <path d='M175 195 L337 195 L315 440 L197 440 Z' fill='#E8F5E9' stroke='#66BB6A' stroke-width='8' stroke-linejoin='round'/>
  <!-- Smoothie liquid gradient colors -->
  <path d='M184 230 L328 230 L308 420 L204 420 Z' fill='url(#smoothieGrad)'/>
  <defs>
    <linearGradient id='smoothieGrad' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#AB47BC'/>
      <stop offset='50%' stop-color='#EC407A'/>
      <stop offset='100%' stop-color='#FF7043'/>
    </linearGradient>
  </defs>
  <!-- Glass shine -->
  <path d='M195 240 L210 415' stroke='white' stroke-width='11' stroke-linecap='round' opacity='0.5'/>
  <!-- Straw -->
  <rect x='270' y='100' width='18' height='200' rx='9' fill='#F48FB1' stroke='#E91E63' stroke-width='3'/>
  <!-- Straw stripes -->
  <rect x='270' y='110' width='18' height='18' rx='0' fill='white' opacity='0.5'/>
  <rect x='270' y='145' width='18' height='18' rx='0' fill='white' opacity='0.5'/>
  <rect x='270' y='180' width='18' height='18' rx='0' fill='white' opacity='0.5'/>
  <rect x='270' y='215' width='18' height='18' rx='0' fill='white' opacity='0.5'/>
  <!-- Fruit decorations around cup -->
  <!-- Strawberry -->
  <ellipse cx='172' cy='310' rx='20' ry='22' fill='#E53935'/>
  <path d='M156 305 Q172 295 188 305' fill='#66BB6A'/>
  <text x='161' y='318' font-size='11' fill='#FFE082'>···</text>
  <!-- Blueberries -->
  <circle cx='345' cy='295' r='13' fill='#5C6BC0'/>
  <circle cx='363' cy='308' r='11' fill='#7986CB'/>
  <circle cx='347' cy='318' r='10' fill='#5C6BC0'/>
  <!-- Kawaii face -->
  <circle cx='228' cy='330' r='12' fill='#333'/>
  <circle cx='280' cy='330' r='12' fill='#333'/>
  <circle cx='231' cy='326' r='4.5' fill='white'/>
  <circle cx='283' cy='326' r='4.5' fill='white'/>
  <!-- Cheeks -->
  <circle cx='208' cy='350' r='14' fill='#FF80AB' opacity='0.6'/>
  <circle cx='302' cy='350' r='14' fill='#FF80AB' opacity='0.6'/>
  <!-- Smile -->
  <path d='M238 360 Q256 378 276 360' stroke='#333' stroke-width='4.5' fill='none' stroke-linecap='round'/>
  <!-- Whipped cream on top -->
  <path d='M192 205 Q220 170 256 168 Q292 170 320 205' stroke='white' stroke-width='14' fill='none' stroke-linecap='round'/>
  <!-- Sparkles -->
  <text x='135' y='245' font-size='22' fill='#FFD700'>✦</text>
  <text x='348' y='250' font-size='18' fill='#E91E63'>★</text>
</svg>
