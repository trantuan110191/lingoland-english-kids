<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'>
  <!-- White background -->
  <rect width='512' height='512' fill='white'/>
  <!-- Shadow -->
  <ellipse cx='256' cy='465' rx='110' ry='18' fill='rgba(0,0,0,0.10)'/>
  <!-- Milk carton body -->
  <rect x='140' y='180' width='232' height='270' rx='22' fill='#E8F4FD' stroke='#90CAF9' stroke-width='8'/>
  <!-- Carton top flap -->
  <polygon points='140,180 256,120 372,180' fill='#BBDEFB' stroke='#90CAF9' stroke-width='8' stroke-linejoin='round'/>
  <!-- Blue stripe top -->
  <rect x='140' y='200' width='232' height='36' fill='#42A5F5'/>
  <!-- Cow spots on carton -->
  <ellipse cx='195' cy='315' rx='25' ry='18' fill='#1E88E5' opacity='0.3'/>
  <ellipse cx='320' cy='280' rx='18' ry='24' fill='#1E88E5' opacity='0.3'/>
  <ellipse cx='258' cy='340' rx='20' ry='14' fill='#1E88E5' opacity='0.2'/>
  <!-- Milk carton label area -->
  <rect x='165' y='255' width='182' height='120' rx='14' fill='white' stroke='#90CAF9' stroke-width='4'/>
  <!-- Cute cow face on label -->
  <ellipse cx='256' cy='310' rx='50' ry='44' fill='#FFF9C4' stroke='#F9A825' stroke-width='3'/>
  <circle cx='240' cy='302' r='8' fill='#333'/>
  <circle cx='272' cy='302' r='8' fill='#333'/>
  <circle cx='242' cy='300' r='3' fill='white'/>
  <circle cx='274' cy='300' r='3' fill='white'/>
  <!-- Cow cheeks -->
  <circle cx='222' cy='316' r='10' fill='#FFB3BA' opacity='0.7'/>
  <circle cx='290' cy='316' r='10' fill='#FFB3BA' opacity='0.7'/>
  <!-- Cow smile -->
  <path d='M240 322 Q256 334 272 322' stroke='#333' stroke-width='3.5' fill='none' stroke-linecap='round'/>
  <!-- Cow nose -->
  <ellipse cx='256' cy='326' rx='16' ry='10' fill='#FFCCBC' stroke='#F9A825' stroke-width='2'/>
  <circle cx='250' cy='326' r='3' fill='#BF360C'/>
  <circle cx='262' cy='326' r='3' fill='#BF360C'/>
  <!-- Stars decoration -->
  <text x='175' y='275' font-size='18' fill='#FFD700'>★</text>
  <text x='320' y='275' font-size='18' fill='#FFD700'>★</text>
  <!-- Milk drops -->
  <ellipse cx='165' cy='440' rx='9' ry='12' fill='#90CAF9' opacity='0.6'/>
  <ellipse cx='345' cy='430' rx='7' ry='10' fill='#90CAF9' opacity='0.6'/>
</svg>
